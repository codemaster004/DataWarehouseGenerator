entities: # Entries that can be generated by the system
  User:
    path: "../data/users.csv"  # path to file for export
    fields:
      Email:
        generator: "email"
        unique: true
      Name:
        generator: "name"
      Surname:
        generator: "surname"
      PasswordHash:
        generator: "hash"
      PhoneNumber:
        generator: "number"
        unique: true
        range: [ 100_000_000, 999_999_999 ]
      isActive:
        generator: "choice"
        values: [ "active", "inactive", "notVerified" ]
      isStaff:
        generator: "choice"
        values: [ 1, 0 ]
      BirthDate:
        generator: "date"
      CreatedAt:
        generator: "date"
    variants: # For more control over parameters during generation
      User:
        isActive:
          weights: [ 0.9, 0.0, 0.1 ]
        isStaff:
          weights: [ 0, 1 ]
        BirthDate:
          range: [ "1960-01-01", "2005-03-18" ]
      Agent:
        isActive:
          weights: [ 1, 0.0, 0.0 ]
        isStaff:
          weights: [ 1, 0 ]
        BirthDate:
          range: [ "1960-01-01", "2005-03-18" ]
  
  Estate:
    path: "../data/estates.csv"
    dependsOn: [ "User", "Address" ]
    fields:
      EstateId:
        autoIncrement: 1
      EstateType:
        generator: "choice"
        values: [ "SingleFamily", "Flat", "Condo" ]
      Area:
        generator: "number"
      NoFloors:
        generator: "choice"
        values: [ "1", "2", "3" ]
      MarketType:
        generator: "choice"
        values: [ "New", "Used", "Old", "Renovated" ]
      DecorCondition:
        generator: "choice"
        values: [ "FullyDecorated", "Unfinished", "InDevelopment", "BareShell" ]
      FK_Address:
        reference: "Address+AddressId"
      FK_OwnedBy:
        reference: "User+Email"
    variants:
      SingleFamily:
        EstateType:
          weights: [ 1, 0, 0 ]
        Area:
          range: [ 80, 500 ]
        NoFloors:
          weights: [ 0.3, 0.6, 0.1 ]
        MarketType:
          weights: [ 0.3, 0.5, 0.1, 0.1 ]
        DecorCondition:
          weights: [ 0.4, 0.3, 0.2, 0.1 ]
      Condo:
        EstateType:
          weights: [ 0, 0, 1 ]
        Area:
          range: [ 100, 200 ]
        NoFloors:
          weights: [ 0.3, 0.7, 0.0 ]
        MarketType:
          weights: [ 0.3, 0.5, 0.1, 0.1 ]
        DecorCondition:
          weights: [ 0.6, 0.2, 0.1, 0.1 ]
      Flat:
        EstateType:
          weights: [ 0, 1, 0 ]
        Area:
          range: [ 20, 250 ]
        NoFloors:
          weights: [ 0.95, 0.05, 0 ]
        MarketType:
          weights: [ 0.4, 0.4, 0.1, 0.1 ]
        DecorCondition:
          weights: [ 0.6, 0.2, 0.1, 0.1 ]
  
  Address:
    path: "../data/address.csv"
    dependsOn: [ "City" ]
    fields:
      AddressId:
        autoIncrement: 1
      PostCode:
        generator: "number"
        range: [ 10_000, 99_999 ]
      StreetName:
        generator: "street"
      StreetNumber:
        generator: "number"
        range: [ 0, 100 ]
      Lat:
        generator: "float"
        range: [ 53.6139, 55.2699 ]
        precision: 4
      Long:
        generator: "float"
        range: [ 17.1451, 19.9751 ]
        precision: 4
      FK_City:
        reference: "City+CityId"

  City:
    path: "../data/city.csv"
    fields:
      CityId:
        autoIncrement: 1
      CityName:
        generator: "choice"
        values: [ "Gdansk", "Gdynia", "Sopot" ]
      District:
        generator: "district"
    variants:
      Gdansk:
        CityName:
          weights: [ 1, 0, 0 ]
        District:
          city: "Gdansk"
      Gdynia:
        CityName:
          weights: [ 0, 1, 0 ]
        District:
          city: "Gdynia"
      Sopot:
        CityName:
          weights: [ 0, 0, 1 ]
        District:
          city: "Sopot"
  
  Request:
    path: "../data/sellRequests.csv"
    dependsOn: [ "User", "Estate" ]
    fields:
      RequestId:
        autoIncrement: 1
      AskingPrice:
        generator: "number"
      BuyRent:
        generator: "choice"
        values: [ "Buy", "Rent" ]
      isAgentAssigned:
        generator: "choice"
        values: [ 1, 0 ]
        weights: [ 0.2, 0.8 ]
      isMadeOnline:
        generator: "choice"
        values: [ 1, 0 ]
      CreatedAt:
        value: "date"
      FK_Estate:
        reference: "Estate+EstateId"
      FK_CreatedBy:
        reference: "User+Email"
    variants:
      FlatForRent:
        BuyRent:
          weights: [ 0, 1 ]
        AskingPrice:
          range: [ 1_500, 20_000 ]
        isMadeOnline:
          weights: [ 0.9, 0.1 ]
      FlatForSale:
        BuyRent:
          weights: [ 1, 0 ]
        AskingPrice:
          range: [ 50_000, 2_000_000 ]
        isMadeOnline:
          weights: [ 0.8, 0.2 ]
      
      SingleFamilyForRent:
        BuyRent:
          weights: [ 0, 1 ]
        AskingPrice:
          range: [ 5_000, 50_000 ]
        isMadeOnline:
          weights: [ 0.9, 0.1 ]
      SingleFamilyForSale:
        BuyRent:
          weights: [ 1, 0 ]
        AskingPrice:
          range: [ 200_000, 10_000_000 ]
        isMadeOnline:
          weights: [ 0.8, 0.2 ]
      
      CondoForRent:
        BuyRent:
          weights: [ 0, 1 ]
        AskingPrice:
          range: [ 2_000, 30_000 ]
        isMadeOnline:
          weights: [ 0.9, 0.1 ]
      CondoForSale:
        BuyRent:
          weights: [ 1, 0 ]
        AskingPrice:
          range: [ 80_000, 5_000_000 ]
        isMadeOnline:
          weights: [ 0.8, 0.2 ]
  
  RequestAgent:
    path: "../data/reqAgent.csv"
    dependsOn: [ "Agent", "Request" ]
    fields:
      FK_Email:
        reference: "Agent+EmailAddress"
      FK_RequestId:
        reference: "Request+RequestId"
      Status:
        generator: "choice"
        values: [ "Accepted", "Rejected", "Pending", "NotInterested" ]
        weights: [ 0, 0, 1, 0 ]
      CreatedAt:
        generator: "date"
  
  Agent:
    path: "../data/agents.csv"
    dependsOn: [ "User" ]
    fields:
      LicenseNumber:
        unique: true
        generator: "number"
        range: [ 10_000, 99_999 ]
      Name:
        reference: "User+Name"
      Surname:
        reference: "User+Surname"
      PhoneNumber:
        reference: "User+PhoneNumber"
      EmailAddress:
        reference: "User+Email"
      Address:
        generator: "street"
      EmploymentStatus:
        generator: "choice"
        values: [ "Full-time", "Part-time", "Contract" ]
        weights: [ 0.8, 0.19, 0.01 ]
      StartDate:
        generator: "date"
        range: [ "2020-01-01", "2022-03-18" ]
      Specialization:
        generator: "choice"
        values: [ "Residential", "Commercial", "Rental" ]
      WorkingHours:
        generator: "choice"
        values: ["6-14", "6-15", "7-15", "7-16", "8-16", "8-17", "9-17", "10-18"]
      AvailabilityStatus:
        generator: "choice"
        values: [ "Available", "Busy", "On Leave" ]
        weights: [ 1, 0, 0 ]
      CommissionFee:
        generator: "float"
        range: [ 1.0, 3.0 ]
        precision: 2
      Remarks:
        value: null

  Form:
    path: "../data/form.csv"
    dependsOn: [ "User" ]
    fields:
      IsSuccessful:
        generator: "choice"
        values: [ 1, 0 ]
      DateOfBirth:
        generator: "date"
        range: [ "2023-01-01", "2024-03-18" ]
      AccountCreated:
        generator: "choice"
        values: [ 1, 0 ]
      IsCreatedOnline:
        generator: "choice"
        values: [ 1, 0 ]
      RequestType:
        generator: "choice"
        values: [ "Sale", "Rent" ]
      RequestStartDate:
        generator: "date"
        range: [ "2023-01-01", "2024-03-18" ]
      RequestStartTime:
        generator: "time"
        range: [ "6:15", "22:30" ]
      RequestSubmissionTime:
        generator: "time"
        range: [ "6:30", "23:00" ]
      CreatedBy:
    variants:
      AccountCreated:
        DateOfBirth:
          reference: "User+BirthDate"
        AccountCreated:
          weights: [ 1, 0 ]
        IsCreatedOnline:
          weights: [ 0.9, 0.1 ]
        RequestType:
          weights: [ 0.6, 0.4 ]
        CreatedBy:
          reference: "User+Email"

      AccountNotCreated:
        IsSuccessful:
          weights: [ 0, 1 ]
        AccountCreated:
          weights: [ 0, 1 ]
        IsCreatedOnline:
          weights: [ 0.7, 0.3 ]
        RequestType:
          weights: [ 0.6, 0.4 ]
        CreatedBy:
          value: "Anonymous"
